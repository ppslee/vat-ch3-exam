<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>객관식 7번</title><link rel="stylesheet" href="mcq.css"></head>
<body><div class="container">
  <div class="header">
    <a href="../index.html" class="home-btn">🏠</a>
    <span class="badge">객관식 7 / 10</span>
    <span class="level">⚡⚡ 상</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
  <h2>【문 7】 수출 재화의 공급시기</h2>
  <p class="question">부가가치세법상 수출하는 재화의 공급시기에 관한 설명으로 가장 <strong>옳은 것</strong>은?</p>
  <div class="choices">
    <label class="choice"><input type="radio" name="q" value="1"><span>① 일반 수출 및 중계무역방식 수출의 경우, 공급시기는 수출재화의 '인도일'로 한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="2"><span>② 원양어업 및 위탁판매수출의 공급시기는 수출재화의 선적일로 하며, 계약금 지급일로부터 선적일까지 6개월 이상인 경우에 한한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="3"><span>③ 위탁가공무역방식 수출 및 외국인도수출의 경우, 공급시기는 '수출재화가 국외에서 인도되는 때'로 한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="4"><span>④ 수입업자가 보세구역 내 수입신고 수리 전 물품을 국내 사업자에게 양도하는 경우, 양도자의 공급시기는 '선적일'로 한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="5"><span>⑤ 위탁가공무역방식 수출을 위해 원재료를 무환 반출한 경우, 반출 시점에 원재료의 공급이 이루어진 것으로 보아 영세율 세금계산서를 발급하여야 한다.</span></label>
  </div>
  <button class="btn-check" onclick="check()">✅ 정답 확인</button>
  <div id="result" class="result"></div>
  <div class="nav">
    <button class="btn-nav" onclick="location.href='q06.html'">← 이전</button>
    <button class="btn-next" onclick="location.href='q08.html'">다음 문제 →</button>
  </div>
</div>
<script>
const A=3, E=`<strong>정답: ③번</strong><br><br>
③ [정답] 위탁가공무역방식 수출 및 외국인도수출의 공급시기는 '수출재화가 국외에서 인도되는 때'입니다. (선적일·반출일이 아님) ✅<br><br>
① 일반 수출의 공급시기는 '선적일' → 오답 &nbsp;② 원양어업·위탁판매수출의 공급시기는 '대금 결산일 또는 공급가액 확정일' → 오답 &nbsp;④ 보세구역 양도의 공급시기는 '수입신고 수리일' → 오답 &nbsp;⑤ 무환 반출은 재화의 공급이 아님 → 오답`;
function check(){const s=document.querySelector('input[name="q"]:checked');const d=document.getElementById('result');if(!s){alert('선택지를 선택하세요!');return;}d.style.display='block';d.className='result '+(+s.value===A?'correct':'wrong');d.innerHTML=(+s.value===A?'🎉 정답!<br><br>':'❌ 오답!<br><br>')+E;}
</script></div></body></html>
