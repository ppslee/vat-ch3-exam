<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>객관식 2번</title><link rel="stylesheet" href="mcq.css"></head>
<body><div class="container">
  <div class="header">
    <a href="../index.html" class="home-btn">🏠</a>
    <span class="badge">객관식 2 / 10</span>
    <span class="level">⚡⚡ 상</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div>
  <h2>【문 2】 주된 사업에 부수되는 재화·용역의 과세·면세 판정</h2>
  <p class="question">부가가치세법상 주된 거래 및 주된 사업에 부수되는 재화 또는 용역의 공급에 관한 설명으로 가장 <strong>옳지 않은 것</strong>은?</p>
  <div class="choices">
    <label class="choice"><input type="radio" name="q" value="1"><span>① 주된 사업과 관련하여 우발적 또는 일시적으로 공급되는 재화·용역은 독립된 공급으로 보지 아니하고, 주된 사업의 면세 여부에 따라 과세·면세를 결정한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="2"><span>② 은행업(면세사업)을 영위하는 법인이 사용하던 은행 건물을 우발적으로 매각하는 경우, 주된 사업이 면세이므로 해당 건물의 처분 거래는 부가가치세가 면세된다.</span></label>
    <label class="choice"><input type="radio" name="q" value="3"><span>③ 제조업(과세사업)을 영위하는 사업자가 과세사업에 사용하던 토지를 일시적으로 처분하는 경우, 주된 사업이 과세이므로 토지의 처분 거래는 부가가치세가 과세된다.</span></label>
    <label class="choice"><input type="radio" name="q" value="4"><span>④ 주된 거래인 재화 공급에 부수하여 대가에 포함되지 않고 별도로 제공하는 인도 전 단순 가공 용역은 주된 재화의 공급에 포함되는 것으로 본다.</span></label>
    <label class="choice"><input type="radio" name="q" value="5"><span>⑤ 면세사업에서 필수적으로 부수하여 발생하는 부산물을 판매하는 경우, 해당 부산물이 과세재화에 해당하더라도 부가가치세는 면세된다.</span></label>
  </div>
  <button class="btn-check" onclick="check()">✅ 정답 확인</button>
  <div id="result" class="result"></div>
  <div class="nav">
    <button class="btn-nav" onclick="location.href='q01.html'">← 이전</button>
    <button class="btn-next" onclick="location.href='q03.html'">다음 문제 →</button>
  </div>
</div>
<script>
const A=3, E=`<strong>정답: ③번</strong><br><br>
③ [오답] 토지는 주된 사업의 과세 여부와 <u>무관하게 무조건 면세재화</u>입니다. 과세사업자가 토지를 처분하더라도 부가가치세는 면세됩니다.<br><br>
① 우발적·일시적 공급 → 주된 사업 기준 판단 → 옳음 &nbsp;② 면세 주사업 + 건물 매각 → 면세 → 옳음 &nbsp;④ 부수 단순 가공 → 주된 공급에 포함 → 옳음 &nbsp;⑤ 면세 부산물 → 면세 → 옳음`;
function check(){const s=document.querySelector('input[name="q"]:checked');const d=document.getElementById('result');if(!s){alert('선택지를 선택하세요!');return;}d.style.display='block';d.className='result '+(+s.value===A?'correct':'wrong');d.innerHTML=(+s.value===A?'🎉 정답!<br><br>':'❌ 오답!<br><br>')+E;}
</script></div></body></html>
