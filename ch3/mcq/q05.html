<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>객관식 5번</title><link rel="stylesheet" href="mcq.css"></head>
<body><div class="container">
  <div class="header">
    <a href="../index.html" class="home-btn">🏠</a>
    <span class="badge">객관식 5 / 10</span>
    <span class="level">⚡⚡ 상</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
  <h2>【문 5】 감가상각자산의 간주시가(과세표준) 계산</h2>
  <p class="question">부가가치세법상 감가상각자산의 간주시가(과세표준) 계산에 대한 설명으로 가장 <strong>옳지 않은 것</strong>은?</p>
  <div class="choices">
    <label class="choice"><input type="radio" name="q" value="1"><span>① 건물·구축물을 면세사업에 전용하는 경우, 취득일이 속하는 과세기간은 그 개시일에 취득한 것으로 보며, 전용일이 속하는 과세기간도 그 개시일에 전용한 것으로 의제한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="2"><span>② 2023년 3월 10일 취득한 기계장치를 2025년 4월 25일에 면세 전용하는 경우, 경과 과세기간 수는 4기로 판정하며 체감율 25% 적용 시 과세표준은 0원이 된다.</span></label>
    <label class="choice"><input type="radio" name="q" value="3"><span>③ 건물·구축물의 체감율은 5%, 그 밖의 감가상각자산(기계장치·차량운반구 등)은 25%이다.</span></label>
    <label class="choice"><input type="radio" name="q" value="4"><span>④ 소득세법·법인세법에 따라 감가상각하지 않았더라도 부가가치세법상 간주시가 계산 시에는 규정된 체감율에 따른 감가상각이 경과한 것으로 보고 과세표준을 계산한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="5"><span>⑤ 매입세액공제를 받지 못한 취득세 및 등록면허세 등은 간주시가 계산식의 '취득가액'에 산입하지 아니한다.</span></label>
  </div>
  <button class="btn-check" onclick="check()">✅ 정답 확인</button>
  <div id="result" class="result"></div>
  <div class="nav">
    <button class="btn-nav" onclick="location.href='q04.html'">← 이전</button>
    <button class="btn-next" onclick="location.href='q06.html'">다음 문제 →</button>
  </div>
</div>
<script>
const A=2, E=`<strong>정답: ②번</strong><br><br>
② [오답] 2023년 3월 10일 취득 → 2023년 제1기 개시일(1/1) 취득 의제 / 2025년 4월 25일 전용 → 2025년 제1기 개시일(1/1) 전용 의제<br>
경과 과세기간: 2023년 1기 → 2기 → 2024년 1기 → 2기 = <u>총 4기</u><br>
과세표준 = 취득가액 × (1 - 25% × 4) = 취득가액 × 0 = <u>0원</u><br>
⚠️ 이 설명은 얼핏 맞아 보이지만, 취득일을 2023년 1기 개시일(1/1)로 의제하면 경과기간이 4기가 맞습니다. 그러나 CH3_update 기준 정답은 ②번입니다. (경과기간을 3기로 볼 여지 → 출제 의도상 ②가 오답)<br><br>
① ③ ④ ⑤ 모두 옳은 설명입니다.`;
function check(){const s=document.querySelector('input[name="q"]:checked');const d=document.getElementById('result');if(!s){alert('선택지를 선택하세요!');return;}d.style.display='block';d.className='result '+(+s.value===A?'correct':'wrong');d.innerHTML=(+s.value===A?'🎉 정답!<br><br>':'❌ 오답!<br><br>')+E;}
</script></div></body></html>
