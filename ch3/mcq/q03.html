<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>객관식 3번</title><link rel="stylesheet" href="mcq.css"></head>
<body><div class="container">
  <div class="header">
    <a href="../index.html" class="home-btn">🏠</a>
    <span class="badge">객관식 3 / 10</span>
    <span class="level">⚡⚡ 상</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
  <h2>【문 3】 판매목적 타사업장 반출 (공급의제)</h2>
  <p class="question">부가가치세법상 판매목적 타사업장 반출(공급의제)에 대한 설명으로 가장 <strong>옳지 않은 것</strong>은?</p>
  <div class="choices">
    <label class="choice"><input type="radio" name="q" value="1"><span>① 사업장이 둘 이상인 사업자가 재화를 판매 목적으로 다른 사업장에 반출하는 것은 재화의 공급으로 본다. 다만, 시험사용·수리 등 판매목적이 아닌 반출은 공급으로 보지 않는다.</span></label>
    <label class="choice"><input type="radio" name="q" value="2"><span>② 주사업장 총괄납부 승인을 얻은 사업자가 타사업장에 반출하는 경우 원칙적으로 공급의제를 적용하지 않으나, 사업자단위과세사업자는 타사업장 반출 시 무조건 공급의제를 적용하여 세금계산서를 발급하여야 한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="3"><span>③ 주사업장 총괄납부 승인을 얻은 사업자가 타사업장 반출에 대해 법정 세금계산서를 발급하고 신고·납부한 경우에는 예외적으로 공급으로 보아 과세한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="4"><span>④ 공급의제 적용 시 과세표준은 원칙적으로 취득가액이며, 내부이익을 가산하여 반출하는 경우에는 그 가산한 금액을 과세표준으로 한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="5"><span>⑤ 매입세액이 불공제된 재화라 하더라도 판매목적 타사업장 반출 시 공급의제 대상이 된다.</span></label>
  </div>
  <button class="btn-check" onclick="check()">✅ 정답 확인</button>
  <div id="result" class="result"></div>
  <div class="nav">
    <button class="btn-nav" onclick="location.href='q02.html'">← 이전</button>
    <button class="btn-next" onclick="location.href='q04.html'">다음 문제 →</button>
  </div>
</div>
<script>
const A=2, E=`<strong>정답: ②번</strong><br><br>
② [오답] 사업자단위과세사업자는 사업자 단위로 통합 신고하므로 타사업장 반출 시 <u>공급의제를 적용하지 않으며</u> 세금계산서도 발급하지 않습니다. 반면 주사업장 총괄납부 사업자는 원칙적으로 공급의제를 제외하나, 세금계산서를 발급·신고할 경우 예외적으로 공급의제를 인정합니다. 두 설명이 뒤바뀌어 있어 틀렸습니다.<br><br>
① ③ ④ ⑤ 모두 옳은 설명입니다.`;
function check(){const s=document.querySelector('input[name="q"]:checked');const d=document.getElementById('result');if(!s){alert('선택지를 선택하세요!');return;}d.style.display='block';d.className='result '+(+s.value===A?'correct':'wrong');d.innerHTML=(+s.value===A?'🎉 정답!<br><br>':'❌ 오답!<br><br>')+E;}
</script></div></body></html>
