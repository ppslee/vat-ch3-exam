<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>객관식 8번</title><link rel="stylesheet" href="mcq.css"></head>
<body><div class="container">
  <div class="header">
    <a href="../index.html" class="home-btn">🏠</a>
    <span class="badge">객관식 8 / 10</span>
    <span class="level">⚡⚡ 상</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
  <h2>【문 8】 용역의 공급시기</h2>
  <p class="question">부가가치세법상 용역의 공급시기에 관한 설명으로 가장 <strong>옳지 않은 것</strong>은?</p>
  <div class="choices">
    <label class="choice"><input type="radio" name="q" value="1"><span>① 임대보증금에 대한 간주임대료의 공급시기는 '예정신고기간 또는 과세기간의 종료일'로 본다.</span></label>
    <label class="choice"><input type="radio" name="q" value="2"><span>② 2과세기간 이상에 걸쳐 부동산 임대용역을 제공하고 임대료를 일시 수령하는 경우, '각 예정신고기간 또는 과세기간의 종료일'을 공급시기로 하며 임대료는 월할계산한다.</span></label>
    <label class="choice"><input type="radio" name="q" value="3"><span>③ 헬스클럽을 운영하는 사업자가 1년 회원권을 판매하고 연회비를 선불로 일시 수령한 경우, 2과세기간 이상에 걸쳐 용역이 제공되더라도 회원권 판매 및 대금 영수일을 공급시기로 본다.</span></label>
    <label class="choice"><input type="radio" name="q" value="4"><span>④ 선불로 받고 상표권 등 권리를 대여하는 용역이 2과세기간 이상에 걸쳐 제공되는 경우, 월할계산하여 '각 예정신고기간 또는 과세기간의 종료일'을 공급시기로 본다.</span></label>
    <label class="choice"><input type="radio" name="q" value="5"><span>⑤ 공급단위를 구획할 수 없는 계속적 용역(경비용역, 컴퓨터 유지보수 등)의 경우 '대가의 각 부분을 받기로 한 때'를 공급시기로 본다.</span></label>
  </div>
  <button class="btn-check" onclick="check()">✅ 정답 확인</button>
  <div id="result" class="result"></div>
  <div class="nav">
    <button class="btn-nav" onclick="location.href='q07.html'">← 이전</button>
    <button class="btn-next" onclick="location.href='q09.html'">다음 문제 →</button>
  </div>
</div>
<script>
const A=3, E=`<strong>정답: ③번</strong><br><br>
③ [오답] 헬스클럽 연회비처럼 2과세기간 이상에 걸쳐 제공되는 용역을 선불로 수령한 경우, 대금 영수일이 공급시기가 <u>아닙니다</u>. 부동산 임대용역과 동일하게 '각 예정신고기간 또는 과세기간의 종료일'을 공급시기로 하여 월할계산합니다.<br><br>
① ② ④ ⑤ 모두 옳은 설명입니다.`;
function check(){const s=document.querySelector('input[name="q"]:checked');const d=document.getElementById('result');if(!s){alert('선택지를 선택하세요!');return;}d.style.display='block';d.className='result '+(+s.value===A?'correct':'wrong');d.innerHTML=(+s.value===A?'🎉 정답!<br><br>':'❌ 오답!<br><br>')+E;}
</script></div></body></html>
