<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부가가치세법 CH3 실전 모의고사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .top-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      color: #1a2b4a;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f4f8;
    }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 12px;
      color: #6b7280;
      font-weight: bold;
      margin-bottom: 7px;
      padding-left: 4px;
      letter-spacing: 0.5px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn span.arrow { font-size: 18px; }
    .btn-blue   { background: #3b82f6; color: white; }
    .btn-blue:hover   { background: #2563eb; transform: translateY(-1px); }
    .btn-green  { background: #10b981; color: white; }
    .btn-green:hover  { background: #059669; transform: translateY(-1px); }
    .btn-orange { background: #f59e0b; color: white; }
    .btn-orange:hover { background: #d97706; transform: translateY(-1px); }
    .info-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f0f4f8;
    }
    .info-item {
      text-align: center;
      flex: 1;
    }
    .info-item .num {
      font-size: 20px;
      font-weight: bold;
      color: #1a2b4a;
    }
    .info-item .label {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .logout-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #d1d5db;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      width: 100%;
      font-family: 'Malgun Gothic', sans-serif;
    }
    .logout-btn:hover { color: #9ca3af; }
  </style>
</head>
<body>

<!-- 🔐 로그인 체크 -->
<script>
  if (sessionStorage.getItem('loggedIn') !== 'true') {
    location.href = 'login.html';
  }
</script>

<div class="container">

  <span class="top-badge">CTA 세무사 1·2차 대비</span>
  <h1>📚 부가가치세법 CH3<br>과세거래 종합 모의고사</h1>
  <p class="subtitle">브라우저만 있으면 어디서든 풀 수 있습니다 ✅</p>

  <div class="section">
    <div class="section-title">📝 제1부 — 객관식</div>
    <a class="btn btn-blue" href="mcq/q01.html">
      <span>객관식 10문항 풀기</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="section">
    <div class="section-title">🧮 제2부 — 주관식 계산문제</div>
    <a class="btn btn-green" href="saq/q01.html">
      <span>주관식 4문항 풀기</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="section">
    <div class="section-title">✍️ 제3부 — 서술형 논술</div>
    <a class="btn btn-orange" href="essay/q01.html">
      <span>서술형 3문항 풀기</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <div class="num">17</div>
      <div class="label">총 문항</div>
    </div>
    <div class="info-item">
      <div class="num">3</div>
      <div class="label">파트</div>
    </div>
    <div class="info-item">
      <div class="num">100%</div>
      <div class="label">무료</div>
    </div>
    <div class="info-item">
      <div class="num">0</div>
      <div class="label">설치 불필요</div>
    </div>
  </div>

  <!-- 로그아웃 버튼 -->
  <button class="logout-btn" onclick="logout()">🔒 로그아웃</button>

</div>

<script>
  function logout() {
    sessionStorage.removeItem('loggedIn');
    location.href = 'login.html';
  }
</script>

</body>
</html>
