<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부가가치세법 완전정복</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f97316;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 44px 36px 36px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .lock-icon {
      font-size: 56px;
      margin-bottom: 14px;
      display: block;
    }

    h1 {
      font-size: 20px;
      color: #1a1a1a;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 28px;
    }

    /* 비밀번호 입력창 */
    .pw-wrapper {
      position: relative;
      margin-bottom: 14px;
    }

    .pw-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #fed7aa;
      border-radius: 12px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 10px;
      color: #1a1a1a;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: monospace;
      background: #fff;
    }

    .pw-input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
    }

    .pw-input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.15);
      animation: shake 0.4s ease;
    }

    .pw-input::placeholder {
      color: #d1d5db;
      letter-spacing: 8px;
      font-size: 20px;
    }

    /* 에러 메시지 */
    .error-msg {
      font-size: 13px;
      color: #ef4444;
      margin-bottom: 12px;
      min-height: 18px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* 입장 버튼 */
    .btn-enter {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Malgun Gothic', sans-serif;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(249,115,22,0.4);
    }

    .btn-enter:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(249,115,22,0.5);
    }

    .btn-enter:active {
      transform: scale(0.97);
    }

    /* 숫자 키패드 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .key {
      padding: 14px;
      background: #fff7ed;
      border: 1.5px solid #fed7aa;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #374151;
      cursor: pointer;
      transition: background .15s, transform .1s;
      font-family: 'Malgun Gothic', sans-serif;
    }

    .key:hover   { background: #ffedd5; }
    .key:active  { transform: scale(0.93); background: #fed7aa; }

    .key.del {
      background: #fef2f2;
      border-color: #fecaca;
      color: #ef4444;
      font-size: 20px;
    }
    .key.del:hover  { background: #fee2e2; }

    .key.empty { background: transparent; border: none; cursor: default; }

    /* 성공 오버레이 */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #f97316, #ea580c);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      z-index: 999;
    }
    .success-overlay.show { display: flex; }

    .check-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: popIn 0.4s ease;
    }

    .success-text {
      font-size: 20px;
      font-weight: bold;
      animation: popIn 0.4s ease 0.1s both;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-5px); }
      80%     { transform: translateX(5px); }
    }
  </style>
</head>
<body>

<div class="card">
  <span class="lock-icon">🔐</span>
  <h1>부가가치세법 완전정복</h1>
  <p class="sub">비밀번호를 입력하세요</p>

  <div class="pw-wrapper">
    <input
      class="pw-input"
      id="pwInput"
      type="password"
      maxlength="4"
      placeholder="· · · ·"
      inputmode="numeric"
      pattern="[0-9]*"
      readonly
    >
  </div>

  <div class="error-msg" id="errorMsg">🔒 비밀번호가 틀렸습니다. 다시 시도하세요.</div>

  <button class="btn-enter" onclick="tryLogin()">🔓 입장하기</button>

  <!-- 숫자 키패드 -->
  <div class="keypad">
    <button class="key" onclick="pressKey('1')">1</button>
    <button class="key" onclick="pressKey('2')">2</button>
    <button class="key" onclick="pressKey('3')">3</button>
    <button class="key" onclick="pressKey('4')">4</button>
    <button class="key" onclick="pressKey('5')">5</button>
    <button class="key" onclick="pressKey('6')">6</button>
    <button class="key" onclick="pressKey('7')">7</button>
    <button class="key" onclick="pressKey('8')">8</button>
    <button class="key" onclick="pressKey('9')">9</button>
    <button class="key empty"></button>
    <button class="key" onclick="pressKey('0')">0</button>
    <button class="key del" onclick="deleteLast()">⌫</button>
  </div>
</div>

<!-- 성공 오버레이 -->
<div class="success-overlay" id="successOverlay">
  <div class="check-icon">✅</div>
  <p class="success-text">입장합니다!</p>
</div>

<script>
  // ✅ 비밀번호 여기서 변경하세요 (4자리 숫자)
  const PASSWORD = '0209';

  let inputVal = '';

  // 키패드 입력
  function pressKey(num) {
    if (inputVal.length >= 4) return;
    inputVal += num;
    updateDisplay();
    // 4자리 다 누르면 자동 로그인 시도
    if (inputVal.length === 4) {
      setTimeout(tryLogin, 300);
    }
  }

  // 마지막 글자 삭제
  function deleteLast() {
    inputVal = inputVal.slice(0, -1);
    updateDisplay();
    clearError();
  }

  // 화면 표시 업데이트
  function updateDisplay() {
    const input = document.getElementById('pwInput');
    input.value = inputVal;
    input.classList.remove('error');
    clearError();
  }

  // 키보드 입력도 지원
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    if (e.key === 'Backspace') deleteLast();
    if (e.key === 'Enter') tryLogin();
  });

  // 로그인 시도
  function tryLogin() {
    const input = document.getElementById('pwInput');
    const err   = document.getElementById('errorMsg');

    if (inputVal.length === 0) {
      showError('비밀번호를 입력하세요.');
      return;
    }

    if (inputVal === PASSWORD) {
      // ✅ 성공
      sessionStorage.setItem('loggedIn', 'true');
      document.getElementById('successOverlay').classList.add('show');
      setTimeout(() => { location.href = 'index.html'; }, 1200);

    } else {
      // ❌ 실패
      input.classList.add('error');
      showError('🔒 비밀번호가 틀렸습니다. 다시 시도하세요.');
      inputVal = '';
      setTimeout(() => {
        input.value = '';
        input.classList.remove('error');
      }, 600);
    }
  }

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent = msg;
    err.classList.add('show');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  // 이미 로그인된 상태면 바로 통과
  if (sessionStorage.getItem('loggedIn') === 'true') {
    location.href = 'index.html';
  }
</script>

</body>
</html>
